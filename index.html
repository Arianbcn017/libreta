<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Libreta</title>
<meta name="description" content="Tus finanzas personales: gastos del día, ocio semanal, cuotas, pesos y dólares, metas y proyección.">
<meta name="theme-color" content="#EAF0E9" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0D1310" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Libreta">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Instrument+Sans:wght@400;500;600;700&display=swap">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html,body{margin:0}body{font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<style>
/* Layout: libreta contable de una columna (máx. 640px): hojas rayadas por sección, cabecera con el mes y pestañas fijas abajo con el botón de carga al centro */
:root {
  --paper: #EAF0E9;
  --sheet: #F8FAF6;
  --sheet-2: #EFF4EE;
  --ink: #15211A;
  --ink-2: #4C5E54;
  --ink-3: #6F8177;
  --rule: #D2DDD2;
  --rule-strong: #A9BCAD;
  --accent: #2344A3;
  --accent-soft: #DCE3F5;
  --on-accent: #FFFFFF;
  --pos: #1A7043;
  --neg: #B1281E;
  --warn: #946000;
  --pos-soft: #DAEDDD;
  --neg-soft: #F6DDD9;
  --warn-soft: #F4E8CC;
  --scrim: rgba(12, 20, 16, .46);
  --cat1: #2a78d6; --cat2: #eb6834; --cat3: #1baf7a; --cat4: #eda100;
  --cat5: #e87ba4; --cat6: #008300; --cat7: #4a3aa7; --cat8: #e34948;
  --shadow: 0 1px 0 rgba(21, 33, 26, .05), 0 10px 28px -14px rgba(21, 33, 26, .30);
  --font-display: "Familjen Grotesk", "Instrument Sans", system-ui, sans-serif;
  --font-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0D1310; --sheet: #141C18; --sheet-2: #19221D;
    --ink: #E1E9E3; --ink-2: #A5B5AB; --ink-3: #7C8D83;
    --rule: #25312B; --rule-strong: #3A4B41;
    --accent: #95ABFF; --accent-soft: #1D2746; --on-accent: #0D1310;
    --pos: #5CC98D; --neg: #FF8E82; --warn: #E4AC47;
    --pos-soft: #15301F; --neg-soft: #3A1B17; --warn-soft: #33280E;
    --scrim: rgba(0, 0, 0, .6);
    --cat1: #3987e5; --cat2: #d95926; --cat3: #199e70; --cat4: #c98500;
    --cat5: #d55181; --cat6: #008300; --cat7: #9085e9; --cat8: #e66767;
    --shadow: 0 1px 0 rgba(0,0,0,.3), 0 12px 30px -12px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0D1310; --sheet: #141C18; --sheet-2: #19221D;
  --ink: #E1E9E3; --ink-2: #A5B5AB; --ink-3: #7C8D83;
  --rule: #25312B; --rule-strong: #3A4B41;
  --accent: #95ABFF; --accent-soft: #1D2746; --on-accent: #0D1310;
  --pos: #5CC98D; --neg: #FF8E82; --warn: #E4AC47;
  --pos-soft: #15301F; --neg-soft: #3A1B17; --warn-soft: #33280E;
  --scrim: rgba(0, 0, 0, .6);
  --cat1: #3987e5; --cat2: #d95926; --cat3: #199e70; --cat4: #c98500;
  --cat5: #d55181; --cat6: #008300; --cat7: #9085e9; --cat8: #e66767;
  --shadow: 0 1px 0 rgba(0,0,0,.3), 0 12px 30px -12px rgba(0,0,0,.7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.45;
}
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.app { max-width: 640px; margin: 0 auto; padding-inline: 16px; padding-block: 0 120px; }

/* Cabecera */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 10px;
  margin-inline: -16px; padding: 10px 16px;
  background: var(--paper);
  border-bottom: 1px solid var(--rule);
}
.brand { display: flex; align-items: baseline; gap: 6px; font-family: var(--font-display); font-weight: 700; font-size: 20px; letter-spacing: -.015em; white-space: nowrap; }
.brand small { font-family: var(--font-body); font-weight: 500; font-size: 12px; color: var(--ink-3); letter-spacing: .01em; }
.vtitle { font-family: var(--font-display); font-size: 17px; font-weight: 600; margin: 0 auto; text-align: center; letter-spacing: -.005em; }
.monthnav { margin-left: auto; display: flex; align-items: center; gap: 2px; }
.monthnav .mlabel { appearance: none; background: none; border: 0; font-family: var(--font-display); font-weight: 600; font-size: 15px; min-width: 10.5ch; text-align: center; padding: 6px 4px; cursor: pointer; border-radius: 8px; }
.monthnav .mlabel small { display: block; font: 500 11px/1 var(--font-body); color: var(--accent); margin-top: 2px; }
.icon-btn { appearance: none; background: none; border: 0; width: 38px; height: 38px; border-radius: 10px; display: grid; place-items: center; color: var(--ink-2); cursor: pointer; flex: none; }
.icon-btn:hover { background: var(--sheet-2); color: var(--ink); }
.icon-btn svg { width: 20px; height: 20px; }
@media (max-width: 380px) { .brand small { display: none; } }
@media (max-width: 400px) { .top .brand.hide-sm { display: none; } .top .brand.hide-sm + .monthnav { margin-left: 0; margin-right: auto; } }
@media (max-width: 360px) { .tab { font-size: 10px; } }

/* Tipografía y utilidades */
h2 { font-family: var(--font-display); font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -.005em; text-wrap: balance; }
h3 { font-family: var(--font-display); font-size: 16px; font-weight: 600; margin: 0; text-wrap: balance; }
.eyebrow { font-size: 11.5px; letter-spacing: .09em; text-transform: uppercase; color: var(--ink-2); font-weight: 600; }
.muted { color: var(--ink-2); font-size: 13px; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; letter-spacing: -.02em; white-space: nowrap; }
.pos { color: var(--pos); }
.neg { color: var(--neg); }
.hint { font-size: 12.5px; color: var(--ink-2); margin: 0; }
.err { font-size: 13px; color: var(--neg); margin: 0; font-weight: 500; min-height: 0; }
.err:empty { display: none; }

.block { margin-top: 26px; }
.block-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 8px; padding-inline: 2px; }
.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 14px; }
.ledger > :last-child { border-bottom: 0; }

/* Resumen del mes */
.hero { margin-top: 16px; padding: 18px 18px 16px; }
.big { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: clamp(30px, 9.5vw, 42px); font-weight: 600; line-height: 1.08; letter-spacing: -.035em; margin-top: 6px; white-space: nowrap; }
.big small { font-size: .42em; font-weight: 500; color: var(--ink-2); letter-spacing: 0; }
.hero .sub { color: var(--ink-2); font-size: 13.5px; margin-top: 4px; }
.split { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--rule-strong); }
.split .lbl { display: block; font-size: 12px; color: var(--ink-2); font-weight: 500; }
.split .num { font-size: 17px; font-weight: 500; }
.note { font-size: 12.5px; color: var(--ink-2); margin: 10px 0 0; }

/* Filas tipo libro */
.row { display: flex; align-items: center; gap: 12px; padding: 11px 14px; border-bottom: 1px solid var(--rule); width: 100%; text-align: left; background: none; border-left: 0; border-right: 0; border-top: 0; }
button.row { cursor: pointer; }
button.row:hover { background: var(--sheet-2); }
.ledger > button.row:first-child { border-radius: 13px 13px 0 0; }
.ledger > button.row:last-child { border-radius: 0 0 13px 13px; }
.ledger > button.row:only-child { border-radius: 13px; }
.grow { flex: 1; min-width: 0; }
.grow b { display: block; font-weight: 600; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.grow small { display: block; font-size: 12.5px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .num { font-size: 14.5px; }
.row-total { background: var(--sheet-2); }
.row-total .grow b { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; display: inline-block; }
.day { font-family: var(--font-num); font-size: 12px; color: var(--ink-2); width: 26px; flex: none; text-align: center; padding: 3px 0; border: 1px solid var(--rule-strong); border-radius: 6px; line-height: 1.1; }
.day small { display: block; font-size: 9.5px; text-transform: uppercase; letter-spacing: .04em; }
.check { width: 18px; height: 18px; flex: none; color: var(--pos); }
.tag { display: inline-flex; align-items: center; font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 999px; background: var(--sheet-2); color: var(--ink-2); border: 1px solid var(--rule); white-space: nowrap; }
.tag.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.pill.ok { background: var(--pos-soft); color: var(--pos); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.bad { background: var(--neg-soft); color: var(--neg); }
.pill svg { width: 14px; height: 14px; }

details.more > summary { list-style: none; cursor: pointer; padding: 10px 14px; font-size: 13px; font-weight: 600; color: var(--accent); }
details.more > summary::-webkit-details-marker { display: none; }
details.more[open] > summary { border-bottom: 1px solid var(--rule); }

/* Categorías */
.cat-row { padding: 11px 14px 12px; border-bottom: 1px solid var(--rule); display: grid; gap: 6px; }
.cat-top { display: flex; align-items: center; gap: 10px; }
.cat-top b { flex: 1; min-width: 0; font-weight: 600; font-size: 14.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar { height: 6px; border-radius: 3px; background: var(--sheet-2); overflow: hidden; box-shadow: inset 0 0 0 1px var(--rule); }
.bar > span { display: block; height: 100%; border-radius: 3px; background: var(--ink-3); }
.bar > .ok { background: var(--pos); }
.bar > .warn { background: var(--warn); }
.bar > .over { background: var(--neg); }
.bar > .acc { background: var(--accent); }
.cat-meta { font-size: 12.5px; color: var(--ink-2); display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.cat-meta .st-over { color: var(--neg); font-weight: 600; }
.cat-meta .st-warn { color: var(--warn); font-weight: 600; }

/* Botones */
.btn { appearance: none; border: 0; border-radius: 12px; padding: 12px 18px; font: 600 15px/1.1 var(--font-body); cursor: pointer; min-height: 46px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-align: center; }
.btn[disabled] { opacity: .55; cursor: default; }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-ghost { background: var(--sheet); color: var(--ink); border: 1px solid var(--rule-strong); }
.btn-ghost:hover { background: var(--sheet-2); }
.btn-danger { background: transparent; color: var(--neg); border: 1px solid var(--neg); }
.btn-sm { min-height: 34px; padding: 7px 12px; font-size: 13.5px; border-radius: 9px; }
.link { appearance: none; background: none; border: 0; color: var(--accent); font-weight: 600; font-size: 13.5px; cursor: pointer; padding: 2px 0; }
.link:hover { text-decoration: underline; }

.banner { margin-top: 16px; padding: 12px 14px; border-radius: 12px; background: var(--accent-soft); display: flex; gap: 10px 14px; align-items: center; flex-wrap: wrap; font-size: 13.5px; }
.banner p { margin: 0; flex: 1 1 220px; }
.banner.warn { background: var(--warn-soft); }

.empty { padding: 20px 18px; display: grid; gap: 12px; justify-items: start; }
.empty p { margin: 0; color: var(--ink-2); max-width: 52ch; }
.steps { margin: 0; padding: 0; list-style: none; display: grid; gap: 10px; counter-reset: s; width: 100%; }
.steps li { display: flex; gap: 12px; align-items: flex-start; }
.steps li::before { counter-increment: s; content: counter(s); font-family: var(--font-num); font-size: 12px; font-weight: 600; width: 24px; height: 24px; border-radius: 50%; border: 1px solid var(--rule-strong); display: grid; place-items: center; flex: none; color: var(--ink-2); }
.steps li.done::before { content: "✓"; background: var(--pos-soft); color: var(--pos); border-color: transparent; }
.steps li.done b { text-decoration: line-through; color: var(--ink-3); }
.steps .grow b { white-space: normal; }
.steps .grow small { white-space: normal; }

/* Movimientos */
.filters { display: grid; gap: 10px; margin-top: 16px; }
.fchips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.fchips::-webkit-scrollbar { display: none; }
.fchip { appearance: none; border: 1px solid var(--rule-strong); background: var(--sheet); border-radius: 999px; padding: 7px 13px; font-size: 13.5px; font-weight: 600; cursor: pointer; white-space: nowrap; color: var(--ink-2); }
.fchip[aria-pressed="true"] { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.search { width: 100%; min-height: 42px; border-radius: 10px; border: 1px solid var(--rule-strong); background: var(--sheet); padding: 9px 12px; font-size: 16px; }
.day-g { margin-top: 18px; }
.day-h { display: flex; justify-content: space-between; gap: 12px; font-size: 12.5px; font-weight: 600; color: var(--ink-2); padding: 0 4px 6px; text-transform: capitalize; }
.amt { text-align: right; flex: none; display: grid; justify-items: end; gap: 3px; }
.amt .num { font-size: 15px; font-weight: 500; }
.amt .tag { font-size: 10.5px; }

/* Metas */
.goal { padding: 16px; display: grid; gap: 10px; }
.goal-h { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.goal-nums { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.goal-nums .num { font-size: 24px; font-weight: 600; }
.goal-meta { display: grid; gap: 2px; font-size: 13px; color: var(--ink-2); }
.goal-meta b { color: var(--ink); font-weight: 600; }
.goal-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.stack { display: grid; gap: 12px; }

/* Proyección */
.seg-view { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; padding: 3px; background: var(--sheet-2); border: 1px solid var(--rule); border-radius: 12px; margin-top: 16px; }
.seg-view button { appearance: none; border: 0; background: none; padding: 8px 6px; border-radius: 9px; font-weight: 600; font-size: 13.5px; color: var(--ink-2); cursor: pointer; }
.seg-view button[aria-pressed="true"] { background: var(--sheet); color: var(--ink); box-shadow: 0 0 0 1px var(--rule); }
.chart-card { padding: 16px 14px 10px; margin-top: 12px; }
.chart { position: relative; margin-top: 12px; min-height: 220px; }
.chart svg { display: block; overflow: visible; touch-action: pan-y; }
.chart .ax { fill: var(--ink-3); font: 11px var(--font-num); }
.chart .grid { stroke: var(--rule); stroke-width: 1; }
.chart .zero { stroke: var(--rule-strong); }
.chart .line { fill: none; stroke: var(--accent); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .area { fill: var(--accent); opacity: .12; }
.chart .endpt { fill: var(--accent); stroke: var(--sheet); stroke-width: 2; }
.chart .xh { stroke: var(--ink-3); stroke-width: 1; stroke-dasharray: 3 3; }
.tip { position: absolute; pointer-events: none; background: var(--ink); color: var(--sheet); padding: 7px 10px; border-radius: 8px; font-size: 12.5px; line-height: 1.35; white-space: nowrap; transform: translate(-50%, calc(-100% - 10px)); box-shadow: var(--shadow); }
.tip b { font-family: var(--font-num); font-weight: 600; }
.assume { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding: 12px 14px; font-size: 13px; color: var(--ink-2); }
.assume .num { color: var(--ink); font-weight: 500; }
.tbl-wrap { overflow-x: auto; border-radius: 14px; }
table { border-collapse: collapse; width: 100%; min-width: 600px; font-size: 13px; }
th { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-2); font-weight: 600; text-align: right; padding: 10px 10px; border-bottom: 1px solid var(--rule-strong); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--rule); text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; white-space: nowrap; }
tr:last-child td { border-bottom: 0; }
th:first-child, td:first-child { text-align: left; position: sticky; left: 0; background: var(--sheet); font-family: var(--font-body); font-weight: 600; }
td.strong { font-weight: 600; }
.how { padding: 4px 14px 14px; font-size: 13.5px; color: var(--ink-2); }
.how ul { margin: 8px 0 0; padding-left: 18px; display: grid; gap: 6px; }
.how summary { cursor: pointer; font-weight: 600; color: var(--ink); padding: 12px 0 4px; }

/* Pestañas */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--sheet); border-top: 1px solid var(--rule); padding-bottom: env(safe-area-inset-bottom, 0px); }
.tabs-in { max-width: 640px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); align-items: end; padding: 6px 6px 8px; }
.tab { appearance: none; background: none; border: 0; color: var(--ink-3); display: flex; flex-direction: column; align-items: center; gap: 3px; font: 600 11px/1.1 var(--font-body); padding: 6px 2px; border-radius: 10px; cursor: pointer; }
.tab svg { width: 22px; height: 22px; }
.tab[aria-current="page"] { color: var(--accent); }
.tab-add { color: var(--ink); }
.tab-add .fab { width: 54px; height: 54px; border-radius: 50%; background: var(--accent); color: var(--on-accent); display: grid; place-items: center; margin-top: -24px; box-shadow: var(--shadow); border: 3px solid var(--sheet); }
.tab-add .fab svg { width: 26px; height: 26px; }

/* Hoja modal */
.sheet-wrap { position: fixed; inset: 0; z-index: 50; display: flex; align-items: flex-end; justify-content: center; }
.scrim { position: absolute; inset: 0; background: var(--scrim); }
.panel { position: relative; width: 100%; max-width: 560px; max-height: 92dvh; display: flex; flex-direction: column; background: var(--sheet); border: 1px solid var(--rule); border-bottom: 0; border-radius: 18px 18px 0 0; box-shadow: var(--shadow); animation: up .2s ease-out; }
@keyframes up { from { transform: translateY(24px); opacity: .4; } to { transform: none; opacity: 1; } }
.panel-h { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 12px 6px 18px; }
.panel-h h3 { font-size: 18px; }
.panel-b { overflow-y: auto; padding: 8px 18px 18px; display: grid; gap: 16px; }
.panel-f { display: flex; gap: 10px; padding: 12px 18px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--rule); }
.panel-f .btn-primary { flex: 1; }
@media (min-width: 700px) { .sheet-wrap { align-items: center; } .panel { border-radius: 18px; border-bottom: 1px solid var(--rule); } }

.field { display: grid; gap: 6px; min-width: 0; }
.field > label, .flabel { font-size: 12.5px; font-weight: 600; color: var(--ink-2); }
.inp, .field input[type="text"], .field input[type="date"], .field select, .field input.inp {
  width: 100%; font-size: 16px; color: var(--ink); background: var(--paper);
  border: 1px solid var(--rule-strong); border-radius: 10px; padding: 10px 12px; min-height: 44px;
}
.field select { appearance: auto; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 420px) { .row2 { grid-template-columns: 1fr; } }
.amount { display: flex; align-items: center; gap: 10px; border-bottom: 2px solid var(--ink); padding-bottom: 2px; }
.amount span { font-family: var(--font-num); font-size: 20px; color: var(--ink-2); flex: none; }
.amount input { flex: 1; min-width: 0; border: 0; background: transparent; font-family: var(--font-num); font-size: 34px; font-weight: 600; letter-spacing: -.03em; padding: 4px 0; outline: none; }
.amount:focus-within { border-bottom-color: var(--accent); }
.amount.sm input { font-size: 22px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { position: relative; }
.chip input { position: absolute; opacity: 0; pointer-events: none; }
.chip span { display: inline-flex; align-items: center; gap: 7px; padding: 7px 12px; border-radius: 999px; border: 1px solid var(--rule-strong); background: var(--sheet); font-size: 14px; font-weight: 500; cursor: pointer; min-height: 36px; }
.chip input:checked + span { background: var(--ink); color: var(--sheet); border-color: var(--ink); }
.chip input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; background: var(--sheet-2); border: 1px solid var(--rule); border-radius: 12px; padding: 3px; gap: 3px; }
.seg label { position: relative; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg span { display: block; text-align: center; padding: 8px 6px; border-radius: 9px; font-weight: 600; font-size: 14px; color: var(--ink-2); cursor: pointer; }
.seg input:checked + span { background: var(--sheet); color: var(--ink); box-shadow: 0 0 0 1px var(--rule-strong); }
.seg input:focus-visible + span { outline: 2px solid var(--accent); }
.swatches { display: flex; gap: 10px; flex-wrap: wrap; }
.swatch { position: relative; }
.swatch input { position: absolute; opacity: 0; }
.swatch span { display: block; width: 30px; height: 30px; border-radius: 50%; cursor: pointer; box-shadow: 0 0 0 2px var(--sheet), 0 0 0 3px transparent; }
.swatch input:checked + span { box-shadow: 0 0 0 2px var(--sheet), 0 0 0 4px var(--ink); }
.swatch input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 4px; }
.checkline { display: flex; align-items: center; gap: 10px; font-size: 14.5px; }
.checkline input { width: 20px; height: 20px; accent-color: var(--accent); }
.aportes { display: grid; }
.aportes .row { padding: 9px 0; }

.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 60; background: var(--ink); color: var(--sheet); padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 500; box-shadow: var(--shadow); max-width: calc(100% - 32px); text-align: center; }
.loading { padding: 28px 18px; color: var(--ink-2); margin-top: 16px; }

@media (prefers-reduced-motion: reduce) { .panel { animation: none; } * { scroll-behavior: auto !important; } }

/* App feel */
body { overscroll-behavior-y: none; -webkit-tap-highlight-color: transparent; }
button, .chip span, .seg span { touch-action: manipulation; }
.field input[type="email"], .field input[type="password"] {
  width: 100%; font-size: 16px; color: var(--ink); background: var(--paper);
  border: 1px solid var(--rule-strong); border-radius: 10px; padding: 10px 12px; min-height: 44px;
}
.bare .tabs { display: none; }

/* Sub navegación (Ahorro) */
.subnav { display: flex; gap: 24px; margin-top: 12px; padding-inline: 2px; border-bottom: 1px solid var(--rule); }

.week-hero .eyebrow b { color: var(--ink); font-weight: 700; }

.sw.ocio { background: var(--accent); }

.hero-cta { display: grid; margin-top: 14px; }

/* Ahorro */
.flow .f-free { background: var(--pos); opacity: .25; }

.quick { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.quick .fchip { white-space: nowrap; }
.sum-big { font-size: 30px; font-weight: 600; letter-spacing: -.02em; margin: 2px 0 6px; }
.det-h { font: 600 14px var(--font-display); margin: 18px 0 0; color: var(--ink); }
.detalle .hitos .row { padding-inline: 0; }
.panel-b > * { min-width: 0; }
.field { grid-template-columns: minmax(0, 1fr); }
.amount input { width: 100%; }
.panel-b { grid-template-columns: minmax(0, 1fr); }

const ymOf = f => String(f).slice(0, 7);
const curYM = () => ymOf(todayStr());
const addM = (ym, n) => { let [y, m] = ym.split('-').map(Number); m += n; y += Math.floor((m - 1) / 12); m = (((m - 1) % 12) + 12) % 12 + 1; return `${y}-${pad(m)}`; };

const IC = {

function artifactStore(db) {
  const known = new Set(), chains = {};
  const serial = (key, fn) => { const p = (chains[key] || Promise.resolve()).catch(() => {}).then(fn); chains[key] = p; return p; };
  const retry = async fn => {
    try { return await fn(); }
    catch (e) { if (e && e.code === 'unavailable') { await sleep(400 + Math.random() * 700); return fn(); } throw e; }
  };
  const exists = async path => { if (known.has(path)) return true; const s = await db.doc(path).get(); if (s.exists) known.add(path); return s.exists; };
  const st = {
    kind: 'artifact',
    watchCol(name, cb, onErr) {
      return db.collection(name).onSnapshot(snap => {
        const m = {};

        cb(m);
      }, onErr);
    },
    watchDoc(path, cb, onErr) { return db.doc(path).onSnapshot(s => { if (s.exists) known.add(path); cb(s.exists, s.exists ? s.data() : null); }, onErr); },
    set: (path, data) => serial(path, () => retry(() => db.doc(path).set(data))).then(() => { known.add(path); }),
    merge: (path, data) => serial(path, async () => {
      if (await exists(path)) await retry(() => db.doc(path).update(data));
      else { await retry(() => db.doc(path).set(data)); known.add(path); }
    }),
    del: path => serial(path, () => retry(() => db.doc(path).delete())).then(() => { known.delete(path); }),
    async many(ops) { for (const o of ops) { if (o.op === 'set') await st.set(o.path, o.data); else if (o.op === 'merge') await st.merge(o.path, o.data); else await st.del(o.path); } }
  };
  return st;
}
function firebaseStore(fs, userId) {
  const FV = firebase.firestore.FieldValue;
  const base = `users/${userId}/`;
  const ref = path => fs.doc(base + path);
  const mergeData = d => {
    const o = {};
    for (const k in d) {
      const v = d[k];
      if (v && typeof v === 'object' && !Array.isArray(v)) { const m = {}; for (const k2 in v) m[k2] = v[k2] === null ? FV.delete() : v[k2]; o[k] = m; }
      else o[k] = v;
    }
    return o;
  };
  const ack = p => new Promise((res, rej) => {
    let done = false;
    const t = setTimeout(() => { if (!done) { done = true; res('queued'); } }, 1500);
    p.then(() => { if (!done) { done = true; clearTimeout(t); res('ok'); } },
           e => { if (!done) { done = true; clearTimeout(t); rej(e); } else toast(errMsg(e)); });
  });
  const watch = (q, deliver, onErr) => {
    let seen = false, last = null;
    const t = setTimeout(() => { if (!seen && last) { seen = true; deliver(last); } }, 6000);
    const un = q.onSnapshot({ includeMetadataChanges: true }, snap => {
      last = snap;
      if (!seen && snap.metadata.fromCache && navigator.onLine) return;
      seen = true; clearTimeout(t); deliver(snap);
    }, onErr);
    return () => { clearTimeout(t); un(); };
  };
  return {
    kind: 'web',
    watchCol(name, cb, onErr) { return watch(fs.collection(base + name), snap => { const m = {}; snap.forEach(d => { m[d.id] = d.data(); }); cb(m); }, onErr); },
    watchDoc(path, cb, onErr) { return watch(ref(path), s => cb(s.exists, s.exists ? s.data() : null), onErr); },
    set: (path, data) => ack(ref(path).set(data)),
    merge: (path, data) => ack(ref(path).set(mergeData(data), { merge: true })),
    del: path => ack(ref(path).delete()),
    many(ops) {
      const chunks = [];
      for (let i = 0; i < ops.length; i += 400) chunks.push(ops.slice(i, i + 400));
      return Promise.all(chunks.map(ch => {
        const b = fs.batch();
        for (const o of ch) {
          if (o.op === 'set') b.set(ref(o.path), o.data);
          else if (o.op === 'merge') b.set(ref(o.path), mergeData(o.data), { merge: true });
          else b.delete(ref(o.path));
        }
        return ack(b.commit());
      }));
    }
  };
}

const ahorroMes = ym => ahorrosList().filter(a => ymOf(a.fecha) === ym).reduce((t, a) => t + a.ars, 0);

function saldos(list) {

}

/* Ocio semanal: el mes se divide en 4 tramos (1–7, 8–14, 15–21, 22–fin) */
const ocioSet = () => new Set(catsDe('gasto').filter(c => c.ocio).map(c => c.id));
const semanaIdx = day => day <= 7 ? 0 : day <= 14 ? 1 : day <= 21 ? 2 : 3;
function ocioMes(ym, list) {
  const mensual = +S.config.ocioMensual || 0, modo = S.config.ocioModo === 'fijo' ? 'fijo' : 'repartir', base = mensual / 4;
  const cats = ocioSet(), fin = daysIn(ym);
  // Las semanas anteriores a cuando empezaste a usar el ocio no suman ni restan.
  const desde = S.config.ocioDesde || null;
  const inicio = desde && ymOf(desde) === ym ? semanaIdx(+desde.slice(8, 10)) : desde && ymOf(desde) > ym ? 4 : 0;
  const W = [[1, 7], [8, 14], [15, 21], [22, fin]].map(([d, h], i) => ({ k: i + 1, desde: d, hasta: h, gastado: 0, items: [], fuera: i < inicio }));
  for (const m of list) if (m.tipo === 'gasto' && !m.pendiente && cats.has(m.categoriaId) && ymOf(m.fecha) === ym) {
    const w = W[semanaIdx(+m.fecha.slice(8, 10))];
    w.gastado += toARS(m.monto, m.moneda, tcOf(m)); w.items.push(m);
  }
  const pool = base * (4 - Math.min(4, inicio));
  let acc = 0;
  W.forEach((w, i) => {
    if (w.fuera) { w.disp = base; return; }
    w.disp = modo === 'fijo' ? base : (pool - acc) / (4 - i);
    acc += w.gastado;
  });
  return { mensual, base, modo, W, total: acc, pool, inicio, cats };
}
// Lo que todavía queda por gastar del presupuesto de ocio de un mes (para separarlo en la cuenta del mes).
function ocioPorGastar(ym, list) {
  const O = ocioMes(ym, list);
  if (!(O.mensual > 0) || !O.cats.size) return { activo: false, resta: 0, usado: 0, mensual: 0 };
  const cur = curYM();
  if (ym < cur) return { activo: true, resta: 0, usado: O.total, mensual: O.pool };
  const wi = ym === cur ? semanaIdx(+todayStr().slice(8, 10)) : 0;
  const resta = O.modo === 'fijo'
    ? O.W.reduce((t, w, i) => t + (w.fuera || i < wi ? 0 : Math.max(0, O.base - w.gastado)), 0)
    : Math.max(0, O.pool - O.total);
  return { activo: true, resta, usado: O.total, mensual: O.pool };
}
function ocioAhora(list) {
  const ym = curYM(), day = +todayStr().slice(8, 10);
  const O = ocioMes(ym, list), wi = semanaIdx(day), w = O.W[wi];
  const disp = Math.max(0, w.disp), resta = disp - w.gastado, dias = w.hasta - day + 1;
  const p = disp > 0 ? w.gastado / disp : (w.gastado > 0 ? 2 : 0);
  return { O, w, wi, disp, resta, dias, p, porDia: resta > 0 ? resta / dias : 0, estado: p > 1 ? 'bad' : p >= 0.85 ? 'warn' : 'ok', activo: O.mensual > 0 && O.cats.size > 0 };
}

/* ---------- escrituras ---------- */
function errMsg(e) {
  const c = e && e.code;
  if (c === 'quota_exceeded') return 'Se llenó el espacio de la libreta. Borrá datos viejos para seguir cargando.';
  if (c === 'invalid_argument') return 'No se pudo guardar. Solo la persona dueña de esta libreta puede editarla.';
  if (c === 'resource_exhausted') return 'Demasiados cambios seguidos. Esperá unos segundos y probá de nuevo.';
  if (c === 'resource-exhausted') return 'Llegaste al límite diario gratuito de Firebase. Se libera mañana.';
  if (c === 'permission-denied' || c === 'unauthenticated') return 'Firebase no dejó guardar. Revisá que las reglas de la base estén publicadas como dice la guía.';
  if (c === 'revoked' || c === 'not_granted') return 'Perdiste acceso a la libreta. Volvé a abrirla desde claude.ai.';
  return 'No se pudo guardar. Revisá la conexión y probá de nuevo.';
}
const canWrite = () => !!S.store && S.status === 'ok';
async function run(fn, okMsg) {
  if (!canWrite()) { toast(S.status === 'private' ? 'Esta libreta es privada: no podés editarla.' : 'Todavía no se conectó con tu libreta. Probá en unos segundos.'); return false; }
  try {
    await fn();
    if (okMsg) toast(okMsg + (ENV === 'web' && !navigator.onLine ? '. Se sincroniza cuando vuelvas a tener conexión.' : ''));
    return true;
  } catch (e) { toast(errMsg(e)); return false; }
}
async function putMov(id, mov, oldDoc) {
  const doc = ymOf(mov.fecha);
  if (oldDoc && oldDoc !== doc) await S.store.merge('meses/' + oldDoc, { items: { [id]: null } });
  await S.store.merge('meses/' + doc, { items: { [id]: mov } });
}
const delMov = (id, doc) => S.store.merge('meses/' + doc, { items: { [id]: null } });
const putDoc = (col, id, data) => S.store.set(col + '/' + id, data);
const updDoc = (col, id, data) => S.store.merge(col + '/' + id, data);
const delDoc = (col, id) => S.store.del(col + '/' + id);

/* ----- Mes ----- */
function viewMes({ list, imps, sal }) {
  let h = nodbBanner();
  if (hayEjemplos(list)) h += ejemplosBanner();
  if (!Object.keys(S.cuentas).length) return h + onboardingHTML();
  const r = resumenMes(S.ym, imps);
  const R = cuentaDelMes(S.ym, list, imps, r);
  h += resumenHTML(R);
  h += pagosHTML(R, list);
  h += ocioMini(list);
  h += categoriasHTML(r);
  h += ultimosHTML(list);
  h += cuentasHTML(sal);
  h += primerosPasos(list);
  return h;
}
/* La cuenta simple del mes: lo que entró, lo que salió, lo que falta y con cuánto terminás */
function cuentaDelMes(ym, list, imps, r) {
  const cur = curYM(), pasado = ym < cur, actual = ym === cur;
  let comprasTarjeta = 0;
  for (const m of list) if (m.tipo === 'gasto' && !m.pendiente && isCard(m.cuentaId) && ymOf(m.fecha) === ym) comprasTarjeta += toARS(m.monto, m.moneda, tcOf(m));
  const res = resumenesMes(ym, imps);
  const tarjeta = res.reduce((t, x) => t + x.total, 0), tarjetaPend = res.filter(x => !x.pagado).reduce((t, x) => t + x.total, 0);
  let faltaCobrar = 0, faltaFijos = 0, faltaGastos = 0;
  const pend = pasado ? [] : fijosMes(ym, list).filter(p => !p.hecho);
  for (const p of pend) { const v = toARS(+p.f.monto || 0, p.f.moneda, S.config.tc); if (p.f.tipo === 'ingreso') faltaCobrar += v; else if (!isCard(p.f.cuentaId)) faltaFijos += v; }
  // Gastos cargados "a pagar": los de este mes y los vencidos de meses anteriores.
  const aPagar = pasado ? [] : list.filter(m => m.tipo === 'gasto' && m.pendiente && (actual ? ymOf(m.fecha) <= ym : ymOf(m.fecha) === ym)).sort((x, y) => x.fecha < y.fecha ? -1 : 1);

function niceTicks(lo, hi, count = 4) {
  const span = hi - lo || 1, raw = span / count, mag = Math.pow(10, Math.floor(Math.log10(raw))), n = raw / mag;
  const step = (n <= 1 ? 1 : n <= 2 ? 2 : n <= 2.5 ? 2.5 : n <= 5 ? 5 : 10) * mag;
  const a = Math.floor(lo / step) * step, b = Math.ceil(hi / step) * step, ticks = [];
  for (let v = a; v <= b + step / 2; v += step) ticks.push(Math.abs(v) < step / 1e6 ? 0 : v);
  return { lo: a, hi: b, ticks };
}
function drawChart() {
  const box = $('#chart'), P = S._proj; if (!box || !P) return;
  const mode = 'ARS', mon = 'ARS';
  const pts = [P.mesActual, ...P.rows];
  const val = p => mode === 'USD' ? p.acc / p.tcI : mode === 'REAL' ? p.acc / p.defl : p.acc;
  const vals = pts.map(val);
  const W = Math.max(260, Math.floor(box.clientWidth || 600)), H = 220, L = 62, R = 12, T = 12, B = 26;
  let lo = Math.min(0, ...vals), hi = Math.max(0, ...vals); if (hi === lo) hi = lo + 1;
  const nt = niceTicks(lo, hi, 4);
  const n = pts.length, x = i => L + i * (W - L - R) / (n - 1), y = v => T + (nt.hi - v) / (nt.hi - nt.lo) * (H - T - B);
  const ppp = (W - L - R) / (n - 1);
  const step = [1, 2, 3, 4, 6, 12].find(s => s * ppp >= 54) || 12;
  const lbl = (p, i) => i === 0 ? 'fin ' + MES_C[+p.ym.slice(5) - 1] : ymShort(p.ym);
  let g = nt.ticks.map(t => `<line class="grid ${t === 0 ? 'zero' : ''}" x1="${L}" x2="${W - R}" y1="${y(t).toFixed(1)}" y2="${y(t).toFixed(1)}"/><text class="ax" x="${L - 8}" y="${(y(t) + 4).toFixed(1)}" text-anchor="end">${compact(t, mon)}</text>`).join('');
  const marks = pts.map((p, i) => i).filter(i => (n - 1 - i) % step === 0);
  if (marks[0] !== 0 && x(marks[0]) - lbl(pts[marks[0]], marks[0]).length * 3.4 > L + lbl(pts[0], 0).length * 6.8 + 8) marks.unshift(0);

  const line = vals.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join('');
  const area = `${line}L${x(n - 1).toFixed(1)},${y(0).toFixed(1)}L${x(0).toFixed(1)},${y(0).toFixed(1)}Z`;
  box.innerHTML = `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Plata disponible proyectada, de ${compact(vals[0], mon)} a ${compact(vals[n - 1], mon)}">${g}
    <path class="area" d="${area}"/><path class="line" d="${line}"/>
    <circle class="endpt" cx="${x(n - 1).toFixed(1)}" cy="${y(vals[n - 1]).toFixed(1)}" r="4.5"/>
    <line class="xh" id="xh" x1="0" x2="0" y1="${T}" y2="${H - B}" visibility="hidden"/>
    <circle class="endpt" id="hdot" r="4.5" cx="0" cy="0" visibility="hidden"/>

    const p = pts[i], v = vals[i], cx = x(i), cy = y(v);
    xh.setAttribute('x1', cx); xh.setAttribute('x2', cx); xh.setAttribute('visibility', 'visible');
    dot.setAttribute('cx', cx); dot.setAttribute('cy', cy); dot.setAttribute('visibility', 'visible');
    const d = mode === 'USD' ? p.tcI : mode === 'REAL' ? p.defl : 1;
    tip.innerHTML = `${i === 0 ? 'Fin de ' + MES[+p.ym.slice(5) - 1] : cap(mesNombre(p.ym))}<br><b>${money(v, mon)}</b><br>ahorro del mes: ${money(p.ahorro / d, mon, { sign: true })}`;

/* Movimiento */
function fixMov(F) {
  const ok = cuentasPara(F.tipo);
  if (!ok.find(k => k.id === F.cuentaId)) F.cuentaId = (ok.find(k => k.id === LS.get('ult.' + F.tipo, null)) || ok[0])?.id || null;
  if (F.tipo === 'transferencia') { const d = ok.filter(k => k.id !== F.cuentaId); if (!d.find(k => k.id === F.cuentaDestinoId)) F.cuentaDestinoId = d[0]?.id || null; }
  if (F.categoriaId && S.categorias[F.categoriaId]?.tipo !== F.tipo) F.categoriaId = null;
  if (F.tipo !== 'gasto') F.soloOcio = false;
  if (!(F.tipo === 'gasto' && isCard(F.cuentaId))) { F.cuotas = 1; F.moneda = null; }
  if (F.tipo !== 'gasto' || isCard(F.cuentaId) || F.ocio) F.pendiente = false;
}
function catsOrdenadas(tipo) {
  const uso = {};
  for (const m of movs()) if (m.categoriaId) uso[m.categoriaId] = (uso[m.categoriaId] || 0) + 1;
  return catsDe(tipo).sort((a, b) => (uso[b.id] || 0) - (uso[a.id] || 0) || byOrden(a, b));
}
function openMov(id, doc, opts = {}) {
  let F;
  if (id) {
    const m = S.meses[doc]?.items?.[id]; if (!m) return;
    F = { ...m, id, doc, montoStr: toInput(m.monto), montoDestinoStr: m.montoDestino != null ? toInput(m.montoDestino) : '' };
  } else {
    F = { tipo: 'gasto', cuentaId: LS.get('ult.gasto', null), fecha: S.ym === curYM() ? todayStr() : S.ym + '-01', cuotas: 1, montoStr: '', nota: '', categoriaId: null };
    if (opts.ocio) {
      const oc = catsDe('gasto').filter(c => c.ocio);
      F.ocio = true; F.soloOcio = oc.length > 0; F.fecha = todayStr();
      F.categoriaId = (oc.find(c => c.id === LS.get('ult.ocioCat', null)) || oc[0])?.id || null;
    }
  }
  fixMov(F);
  openSheet('mov', F);
}
function openPagoMov(id, doc) {

  const F = { ...m, id, doc, montoStr: toInput(m.monto), montoDestinoStr: '', pendiente: false, vence: m.vence || m.fecha, fecha: todayStr(), pagando: true };

}
function openMovFromFijo(fid) {

  const ym = S.ym, dia = Math.min(f.dia || 1, daysIn(ym));
  const F = { tipo: f.tipo, cuentaId: f.cuentaId, categoriaId: f.categoriaId, fecha: ym === curYM() ? todayStr() : `${ym}-${pad(dia)}`, cuotas: 1, moneda: f.moneda, montoStr: toInput(+f.monto), nota: f.nombre, fijoId: fid };
  fixMov(F);

function readMov(form, F) {
  F.tipo = radioVal(form, 'tipo') || F.tipo;
  F.cuentaId = radioVal(form, 'cuenta') ?? F.cuentaId;
  F.cuentaDestinoId = radioVal(form, 'destino') ?? F.cuentaDestinoId;

}

    if (!F.cuentaId || !S.cuentas[F.cuentaId]) return setErr('Elegí una cuenta. Si no tenés, creala en Ajustes.');

function movHints() {

    h.textContent = monto > 0
      ? (n > 1 ? `${n} cuotas de ${money(monto / n, mon, { dec: true })}. La primera se paga en ${mesNombre(q[0].ym)} y la última en ${mesNombre(q[n - 1].ym)}.` : `Se paga en el resumen de ${mesNombre(q[0].ym)}.`)
      : `La tarjeta cierra el ${c?.cierre || 25}: lo que compres hasta ese día se paga el mes siguiente.`;
  }

    o.textContent = monto > 0 ? (r >= 0 ? `Después de este gasto te quedan ${money(r)} esta semana.` : `Con este gasto te pasás ${money(-r)} esta semana.`) : `Esta semana te quedan ${money(A.resta)}.`;
  }
}

    const f = d.exportado ? new Date(d.exportado) : null;
    const b = `<p>Copia${f && !isNaN(f) ? ` del ${f.getDate()} de ${MES[f.getMonth()]} de ${f.getFullYear()}` : ''} con ${n} movimientos, ${Object.keys(d.cuentas || {}).length} cuentas y ${Object.keys(d.objetivos || {}).length} metas.</p>
      <div class="banner warn" style="margin:0"><p>Reemplaza todo lo que hay ahora en tu libreta por el contenido de la copia.</p></div>
      <p class="err" id="sheet-err" role="alert"></p>`;
    return { title: 'Restaurar copia', body: b, foot: saveBtn('Restaurar copia') };
  },
  async save() {
    const d = SH.data.d, ops = [];
    for (const col of COLS) {
      const src = d[col] || {};
      for (const id of Object.keys(S[col])) if (!(id in src)) ops.push({ op: 'del', path: `${col}/${id}` });
      for (const [id, data] of Object.entries(src)) if (data && typeof data === 'object') ops.push({ op: 'set', path: `${col}/${id}`, data });
    }
    if (d.config && typeof d.config === 'object') ops.push({ op: 'set', path: 'config/main', data: d.config });
    if (await run(() => S.store.many(ops), 'Copia restaurada')) closeSheet();
  }
};

/* ---------- acciones ---------- */
async function crearSugeridas() {
  const ids = {}, hoy = todayStr(), ops = [];
  let orden = 0;
  for (const c of SUGERIDAS.cuentas) ids[c.key] = uid() + orden++;
  orden = 0;
  for (const c of SUGERIDAS.cuentas) {
    const data = { nombre: c.nombre, tipo: c.tipo, moneda: c.moneda, orden: orden++, archivada: false, ejemplo: false, saldoInicial: 0, desde: hoy, cierre: null, pagaCon: null };
    if (c.tipo === 'tarjeta') Object.assign(data, { cierre: 25, pagaCon: ids.banco, desde: null });
    ops.push({ op: 'set', path: 'cuentas/' + ids[c.key], data });
  }
  orden = 0;
  for (const [nombre, color, ocio] of SUGERIDAS.gastos) ops.push({ op: 'set', path: 'categorias/' + uid() + orden, data: { nombre, tipo: 'gasto', color, presupuesto: 0, orden: orden++, ocio: !!ocio } });
  for (const [nombre, color] of SUGERIDAS.ingresos) ops.push({ op: 'set', path: 'categorias/' + uid() + orden, data: { nombre, tipo: 'ingreso', color, presupuesto: 0, orden: orden++, ocio: false } });
  if (!S.hasConfig) ops.push({ op: 'set', path: 'config/main', data: { ...DEF_CONFIG } });
  await run(() => S.store.many(ops), 'Listo: cuentas y categorías creadas');
}
async function borrarEjemplos() {
  const ops = [];
  for (const [ym, d] of Object.entries(S.meses)) {
    const it = d.items || {}, patch = {};
    for (const k in it) if (it[k] && it[k].ejemplo) patch[k] = null;
    if (Object.keys(patch).length) ops.push({ op: 'merge', path: 'meses/' + ym, data: { items: patch } });
  }
  for (const [id, f] of Object.entries(S.fijos)) if (f.ejemplo) ops.push({ op: 'del', path: 'fijos/' + id });
  for (const [id, o] of Object.entries(S.objetivos)) if (o.ejemplo) ops.push({ op: 'del', path: 'objetivos/' + id });
  for (const [id, c] of Object.entries(S.cuentas)) if (c.ejemplo) ops.push({ op: 'set', path: 'cuentas/' + id, data: { ...c, saldoInicial: 0, desde: c.tipo === 'tarjeta' ? null : todayStr(), ejemplo: false } });
  await run(() => S.store.many(ops), 'Ejemplos borrados. Tu libreta está lista para tus datos.');
}
async function saveFile(filename, data, mime) {
  if (ENV === 'web') {
    try {
      const url = URL.createObjectURL(new Blob([data], { type: mime }));
      const a = document.createElement('a'); a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      return true;
    } catch { toast('No se pudo generar el archivo.'); return false; }
  }
  if (!S.downloads) { toast('La descarga no está disponible en esta vista.'); return false; }
  try { await S.downloads.save({ filename, data }); return true; }
  catch (e) { if (e?.code === 'declined') return false; toast(e?.code === 'rate_limited' ? 'Ya hay una descarga esperando tu confirmación.' : 'No se pudo generar el archivo.'); return false; }
}
async function exportar() {
  const list = movs();
  if (!list.length) { toast('Todavía no hay movimientos para exportar.'); return; }
  const cell = v => { const s = String(v ?? ''); return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  const num = n => n == null ? '' : String(round2(n)).replace('.', ',');
  const rows = [['Fecha', 'Tipo', 'Monto', 'Moneda', 'Cuenta', 'Categoría', 'Ocio', 'Cuotas', 'Cuenta destino', 'Monto destino', 'Nota', 'Tipo de cambio', 'Estado', 'Vence']];
  const oc = ocioSet();
  for (const m of list.slice().reverse()) rows.push([m.fecha, m.tipo, num(m.monto), m.moneda, cuentaName(m.cuentaId), m.tipo === 'transferencia' ? '' : catName(m.categoriaId), oc.has(m.categoriaId) ? 'sí' : '', m.cuotas || 1, m.cuentaDestinoId ? cuentaName(m.cuentaDestinoId) : '', num(m.montoDestino), m.nota || '', num(m.tc), m.pendiente ? 'a pagar' : 'pagado', m.vence || '']);
  if (await saveFile(`libreta-movimientos-${todayStr()}.csv`, String.fromCharCode(0xfeff) + rows.map(r => r.map(cell).join(';')).join('\n'), 'text/csv')) toast('Archivo listo');
}
async function backup() {
  const d = { app: 'libreta', version: 1, exportado: new Date().toISOString(), config: S.hasConfig ? S.config : null };
  for (const col of COLS) d[col] = S[col];
  if (await saveFile(`libreta-copia-${todayStr()}.json`, JSON.stringify(d), 'application/json')) { LS.set('ultBackup', todayStr()); toast('Copia descargada'); render(); }
}
function versionTxt() {
  const b = String(window.LIBRETA_BUILD || '');
  if (b.length < 12) return 'Actual';
  const d = new Date(Date.UTC(+b.slice(0, 4), +b.slice(4, 6) - 1, +b.slice(6, 8), +b.slice(8, 10), +b.slice(10, 12)));
  return `Del ${d.getDate()} de ${MES[d.getMonth()]}, ${pad(d.getHours())}:${pad(d.getMinutes())}`;
}
async function updateApp() {
  toast('Buscando actualización…');
  let reg = null;
  try { reg = await navigator.serviceWorker?.getRegistration(); if (reg) await reg.update(); } catch {}
  const reload = () => (window.__reloadOnce ? window.__reloadOnce() : location.reload());
  // Si encontró una versión nueva, la app se recarga sola apenas se instala.
  if (reg && (reg.installing || reg.waiting)) setTimeout(reload, 8000); else setTimeout(reload, 400);
}
function setTab(t) {
  if (!TABS.includes(t)) return;
  if (t === 'ajustes' && S.tab !== 'ajustes') S.prevTab = S.tab;
  S.tab = t; LS.set('tab', t);
  try { history.replaceState(null, '', '#' + t); } catch {}
  render(); window.scrollTo(0, 0);
}

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b) return;
  const a = b.dataset.act, id = b.dataset.id;
  switch (a) {
    case 'tab': if (SH) closeSheet(); setTab(b.dataset.tab); break;
    case 'prev-m': S.ym = addM(S.ym, -1); render(); break;
    case 'next-m': S.ym = addM(S.ym, 1); render(); break;
    case 'today-m': S.ym = curYM(); render(); break;
    case 'add':
      if (!Object.keys(S.cuentas).length) { toast('Primero creá tus cuentas.'); break; }
      if (S.tab === 'semana' && ocioAhora(movs()).activo) openMov(null, null, { ocio: true }); else openMov();
      break;
    case 'add-ocio': openMov(null, null, { ocio: true }); break;
    case 'all-cats': readMov($('#sheet'), SH.data); SH.data.soloOcio = false; drawSheet(); break;
    case 'edit-mov': openMov(id, b.dataset.doc); break;
    case 'reg-fijo': openMovFromFijo(id); break;
    case 'filter': S.f.tipo = b.dataset.v; render(); break;
    case 'proj': S.proj = b.dataset.v; LS.set('proj', S.proj); render(); break;
    case 'ahorro': S.ahorro = b.dataset.v; LS.set('ahorro', S.ahorro); render(); break;
    case 'ocio-cfg': openSheet('ocio', {}); break;
    case 'new-cuenta': openSheet('cuenta', { tipo: 'banco', moneda: 'ARS' }); break;
    case 'edit-cuenta': if (S.cuentas[id]) openSheet('cuenta', { id, ...S.cuentas[id] }); break;
    case 'new-cat': openSheet('cat', { tipo: b.dataset.tipo || 'gasto', color: 1 }); break;
    case 'edit-cat': if (S.categorias[id]) openSheet('cat', { id, ...S.categorias[id] }); break;
    case 'new-fijo': { const c = cuentasPara('gasto')[0]; openSheet('fijo', { tipo: 'gasto', dia: 10, activo: true, cuentaId: LS.get('ult.gasto', null) || c?.id }); break; }
    case 'edit-fijo': if (S.fijos[id]) openSheet('fijo', { id, ...S.fijos[id] }); break;
    case 'new-obj': openSheet('obj', { moneda: 'ARS' }); break;
    case 'edit-obj': if (S.objetivos[id]) openSheet('obj', { id, ...S.objetivos[id] }); break;
    case 'aportar': if (S.objetivos[id]) openAhorro({ metaId: id }); break;
    case 'ahorrar': openAhorro(); break;
    case 'edit-ahorro': openAhorro({ id }); break;
    case 'ah-fill': { const i = $('#h-monto'); if (i) { i.value = toInput(+b.dataset.v); i.focus(); } break; }
    case 'pagar-mov': openPagoMov(id, b.dataset.doc); break;
    case 'pagar-tc': openSheet('pagotc', { cardId: id, ym: S.ym }); break;
    case 'config': openSheet('config', {}); break;
    case 'export': exportar(); break;
    case 'backup': backup(); break;
    case 'restore': if (!canWrite()) { toast('Todavía no se conectó con tu libreta.'); break; } $('#restore-file').click(); break;
    case 'sugeridas': b.disabled = true; crearSugeridas().finally(() => { b.disabled = false; }); break;
    case 'clear-ej':
      if (!b.dataset.armed) { b.dataset.armed = '1'; b.textContent = 'Tocá de nuevo para confirmar'; setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = 'Borrar ejemplos'; } }, 4000); break; }
      b.disabled = true; borrarEjemplos(); break;
    case 'close': closeSheet(); break;
    case 'del':
      if (!b.dataset.armed) { b.dataset.armed = '1'; b.textContent = 'Tocá de nuevo para confirmar'; break; }
      b.disabled = true; Promise.resolve(SHEETS[SH.kind].del()).finally(() => { if (b.isConnected) b.disabled = false; });
      break;
    case 'install':
      if (deferredPrompt) { const p = deferredPrompt; deferredPrompt = null; p.prompt(); p.userChoice?.finally?.(() => queueRender()); }
      break;
    case 'no-install': LS.set('noInstall', true); render(); break;
    case 'login-mode': S.login.mode = b.dataset.v; S.login.err = ''; S.lastKey = null; render(); break;
    case 'reset-pass': {
      const email = ($('#l-email')?.value || '').trim();
      if (!email) { S.login.err = 'Escribí tu email y tocá de nuevo "Me olvidé la contraseña".'; $('#login-err').textContent = S.login.err; break; }
      S.auth.sendPasswordResetEmail(email).then(() => toast('Te mandé un email para crear una contraseña nueva.')).catch(err => { $('#login-err').textContent = authMsg(err); });
      break;
    }
    case 'update-app': updateApp(); break;
    case 'logout':
      if (!b.dataset.armed) { b.dataset.armed = '1'; b.textContent = 'Tocá de nuevo para salir'; setTimeout(() => { if (b.isConnected) { delete b.dataset.armed; b.textContent = 'Cerrar sesión'; } }, 4000); break; }
      S.auth?.signOut(); break;
  }
});
const sheetForm = $('#sheet');
sheetForm.addEventListener('submit', async e => {
  e.preventDefault(); if (!SH) return;
  const btn = $('#sheet-save'); if (btn) btn.disabled = true;
  try { await SHEETS[SH.kind].save(sheetForm); } finally { if (btn && btn.isConnected) btn.disabled = false; }
});
sheetForm.addEventListener('change', e => { if (SH && SHEETS[SH.kind].change) SHEETS[SH.kind].change(sheetForm, e); });
sheetForm.addEventListener('input', e => { if (SH && SHEETS[SH.kind].input) SHEETS[SH.kind].input(sheetForm, e); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && SH) closeSheet(); });
document.addEventListener('input', e => {
  if (e.target.id === 'q') { S.f.q = e.target.value; $('#movlist').innerHTML = movListHTML({ list: movs() }); }
});
document.addEventListener('change', e => {
  if (e.target.id !== 'restore-file') return;
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if (!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const d = JSON.parse(r.result);
      if (!d || d.app !== 'libreta' || typeof d.meses !== 'object') throw new Error('formato');
      openSheet('restore', { d });
    } catch { toast('Ese archivo no es una copia de la Libreta.'); }
  };
  r.onerror = () => toast('No se pudo leer el archivo.');
  r.readAsText(f);
});
document.addEventListener('submit', async e => {
  if (e.target.id !== 'login-form') return;
  e.preventDefault();
  const form = e.target, email = form.email.value.trim(), pass = form.pass.value, btn = $('#login-btn'), errEl = $('#login-err');
  S.login.email = email; LS.set('email', email);
  if (!email) { errEl.textContent = 'Escribí tu email.'; return; }
  if (!pass) { errEl.textContent = 'Escribí tu contraseña.'; return; }
  if (S.login.mode === 'crear' && pass.length < 6) { errEl.textContent = 'La contraseña tiene que tener al menos 6 caracteres.'; return; }
  btn.disabled = true; errEl.textContent = '';
  try {
    if (S.login.mode === 'crear') await S.auth.createUserWithEmailAndPassword(email, pass);
    else await S.auth.signInWithEmailAndPassword(email, pass);
    S.login.err = '';
  } catch (err) { S.login.err = authMsg(err); errEl.textContent = S.login.err; }
  finally { if (btn.isConnected) btn.disabled = false; }
});
let rz = 0;
document.addEventListener('toggle', e => { if (e.target && e.target.id === 'proy-det') S.detOpen = e.target.open; }, true);
window.addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(() => { if (S.tab === 'ahorro') drawChart(); }, 150); });
window.addEventListener('hashchange', () => { const t = tabFromHash(location.hash.slice(1)); if (t && t !== S.tab) { S.tab = t; render(); } });

/* ---------- arranque y sincronización ---------- */
let subs = [];
function stopSync() {
  subs.forEach(u => { try { u(); } catch {} });
  subs = [];
  for (const c of COLS) S[c] = {};
  S.config = { ...DEF_CONFIG }; S.hasConfig = false; S.loaded = {}; S.store = null;
}
function startSync() {
  const st = S.store;
  const need = [...COLS, 'config'];
  const done = () => { if (S.status === 'loading' && need.every(k => S.loaded[k])) S.status = 'ok'; queueRender(); };
  const onErr = (name, again) => err => {
    const c = err && err.code;
    if (c === 'revoked' || c === 'not_granted') { S.status = 'nodb'; queueRender(); return; }
    if (c === 'permission-denied') { S.status = 'denied'; queueRender(); return; }
    if (c === 'unavailable') { setTimeout(() => { if (S.store === st) subs.push(again()); }, 3000); return; }
    toast('Hubo un problema al leer tus datos. Recargá la página.');
  };
  const sub = name => st.watchCol(name, map => { if (S.store !== st) return; S[name] = map; S.loaded[name] = true; done(); }, onErr(name, () => sub(name)));
  const subCfg = () => st.watchDoc('config/main', (ex, data) => {
    if (S.store !== st) return;
    S.hasConfig = ex; S.config = { ...DEF_CONFIG, ...(ex ? data : {}) };
    S.loaded.config = true; done();
  }, onErr('config', subCfg));
  for (const c of COLS) subs.push(sub(c));
  subs.push(subCfg());
}
async function bootArtifact() {
  let db = null;
  try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch { db = null; }
  if (!db) { S.status = 'nodb'; render(); return; }
  try {
    const user = await window.claude.use('user');
    if (user && !(await user.isOwner())) { S.status = 'private'; render(); return; }
  } catch {}
  window.claude.use('downloads').then(d => { S.downloads = d; }).catch(() => {});
  S.store = artifactStore(db);
  startSync();
}
function bootWeb() {
  const cfg = window.LIBRETA_FIREBASE;
  if (!cfg || !cfg.apiKey) { S.status = 'setup'; render(); return; }
  if (!window.firebase) { S.status = 'noload'; render(); return; }
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); deferredPrompt = e; queueRender(); });
  window.addEventListener('appinstalled', () => { deferredPrompt = null; queueRender(); });
  window.addEventListener('online', queueRender);
  window.addEventListener('offline', queueRender);
  firebase.initializeApp(cfg);
  const fs = firebase.firestore();
  try { fs.enablePersistence({ synchronizeTabs: true }).catch(() => {}); } catch {}
  S.auth = firebase.auth();
  S.auth.onAuthStateChanged(user => {
    stopSync();
    if (!user) { S.user = null; S.status = 'login'; S.lastKey = null; render(); return; }
    S.user = { email: user.email || '', uid: user.uid };
    S.status = 'loading'; S.login = null; render();
    S.store = firebaseStore(fs, user.uid);
    startSync();
  });
}
render();
if (ENV === 'web') bootWeb(); else bootArtifact();
})();

<script>
if ('serviceWorker' in navigator) {
  // Cuando hay una versión nueva, se instala sola y la app se recarga (nunca con un formulario abierto).
  const had = !!navigator.serviceWorker.controller;
  let pend = false;
  window.__reloadOnce = () => { if (window.__swReloaded) return; window.__swReloaded = true; location.reload(); };
  const sheetOpen = () => { const w = document.getElementById('sheet-wrap'); return !!w && !w.hidden; };
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!had) return;
    if (sheetOpen() && document.visibilityState === 'visible') pend = true; else window.__reloadOnce();
  });
  window.addEventListener('load', () => navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).then(reg => {
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') reg.update().catch(() => {});
      else if (pend) window.__reloadOnce();
    });
  }).catch(() => {}));
}
</script>
